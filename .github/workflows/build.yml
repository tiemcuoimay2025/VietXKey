name: Build VietXKey Windows x64

on:
  workflow_dispatch:
  pull_request:
    paths: ['core/**', 'ffi/**', 'platforms/**', 'ui_imgui/**', 'assets/**', 'scripts/**', 'Cargo.*', '.github/workflows/build.yml']

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Check Rust toolchain
        shell: pwsh
        run: rustup show
      - name: Build and test native x64 app
        shell: pwsh
        run: |
          ./scripts/build-vietxkey.ps1
          if ($LASTEXITCODE -ne 0) { throw 'VietXKey build failed' }
      - name: Verify native configuration persistence
        shell: pwsh
        run: |
          cmake -S ui_imgui -B ui_imgui/build -DVIETFLOW_BUILD_CONFIG_TESTS=ON -DVIETFLOW_STATIC_CRT=ON
          if ($LASTEXITCODE -ne 0) { throw 'Config test configure failed' }
          cmake --build ui_imgui/build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Config test build failed' }
          ctest --test-dir ui_imgui/build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Config tests failed' }
